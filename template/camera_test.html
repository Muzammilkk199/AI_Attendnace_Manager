{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Test - AI Attendance Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-camera"></i> Camera Test
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <button id="testCamera" class="btn btn-primary">
                                <i class="fas fa-play"></i> Test Camera
                            </button>
                            <button id="stopCamera" class="btn btn-danger" disabled>
                                <i class="fas fa-stop"></i> Stop Camera
                            </button>
                        </div>
                        
                        <div class="video-container" style="background: #000; border-radius: 8px; overflow: hidden;">
                            <video id="testVideo" autoplay muted playsinline style="width: 100%; height: 400px; object-fit: cover;"></video>
                        </div>
                        
                        <div class="mt-3">
                            <div id="status" class="alert alert-info">
                                Click "Test Camera" to start
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <h6>Debug Information:</h6>
                            <div id="debugInfo" class="bg-light p-3 rounded">
                                <p><strong>getUserMedia supported:</strong> <span id="getUserMediaSupported">Checking...</span></p>
                                <p><strong>HTTPS:</strong> <span id="isHttps">Checking...</span></p>
                                <p><strong>Video element found:</strong> <span id="videoElementFound">Checking...</span></p>
                                <p><strong>Error:</strong> <span id="errorMessage">None</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Camera test page loaded');
            
            const testVideo = document.getElementById('testVideo');
            const testButton = document.getElementById('testCamera');
            const stopButton = document.getElementById('stopCamera');
            const status = document.getElementById('status');
            const debugInfo = document.getElementById('debugInfo');
            
            // Check browser support
            const getUserMediaSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
            const isHttps = location.protocol === 'https:' || location.hostname === 'localhost';
            const videoElementFound = !!testVideo;
            
            document.getElementById('getUserMediaSupported').textContent = getUserMediaSupported ? 'Yes' : 'No';
            document.getElementById('isHttps').textContent = isHttps ? 'Yes' : 'No';
            document.getElementById('videoElementFound').textContent = videoElementFound ? 'Yes' : 'No';
            
            testButton.addEventListener('click', async function() {
                try {
                    status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Requesting camera access...';
                    status.className = 'alert alert-warning';
                    
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: 'user'
                        }
                    });
                    
                    testVideo.srcObject = stream;
                    
                    testVideo.onloadedmetadata = function() {
                        status.innerHTML = '<i class="fas fa-check-circle"></i> Camera working! Video size: ' + testVideo.videoWidth + 'x' + testVideo.videoHeight;
                        status.className = 'alert alert-success';
                        testButton.disabled = true;
                        stopButton.disabled = false;
                    };
                    
                    testVideo.onerror = function(error) {
                        status.innerHTML = '<i class="fas fa-exclamation-circle"></i> Video error: ' + error.message;
                        status.className = 'alert alert-danger';
                        document.getElementById('errorMessage').textContent = error.message;
                    };
                    
                } catch (error) {
                    console.error('Camera error:', error);
                    status.innerHTML = '<i class="fas fa-exclamation-circle"></i> Camera error: ' + error.message;
                    status.className = 'alert alert-danger';
                    document.getElementById('errorMessage').textContent = error.message;
                }
            });
            
            stopButton.addEventListener('click', function() {
                if (testVideo.srcObject) {
                    testVideo.srcObject.getTracks().forEach(track => track.stop());
                    testVideo.srcObject = null;
                }
                status.innerHTML = '<i class="fas fa-stop-circle"></i> Camera stopped';
                status.className = 'alert alert-info';
                testButton.disabled = false;
                stopButton.disabled = true;
            });
        });
    </script>
</body>
</html>
